<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Texto do Arquivo</title>
</head>
<body>
    <h2>Leitor de Arquivos</h2>
    
    <p class="textoArquivo" data-arquivo="nomes.txt">Carregando...</p>
    <p class="textoArquivo" data-arquivo="compras.txt">Carregando...</p>
    <p class="textoArquivo" data-arquivo="contatos.txt">Carregando...</p>

    <script>
        // FUNÇÃO QUE RECEBE O NOME DO ARQUIVO
        async function carregarArquivo(elemento) {
            const nomeArquivo = elemento.dataset.arquivo; // Pega o nome do data-arquivo
            
            try {
                const resposta = await fetch(`texto/${nomeArquivo}`);
                const texto = await resposta.text();
                elemento.innerHTML = texto.replace(/\n/g, '<br>');
            } catch (erro) {
                elemento.textContent = `❌ Erro ao carregar ${nomeArquivo}`;
            }
        }

        // CARREGA TODOS OS <p> COM data-arquivo
        document.querySelectorAll('.textoArquivo').forEach(carregarArquivo);
    </script>
</body>
</html>
